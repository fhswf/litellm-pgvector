apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-pgvector
  labels:
    app.kubernetes.io/name: litellm-pgvector
spec:
  replicas: 1
  # The app initializes its database schema at process startup; avoid overlapping
  # old and new pods while that initialization runs.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-pgvector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-pgvector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/fhswf/litellm-pgvector
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: litellm-pgvector-config
            - secretRef:
                name: litellm-pgvector-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 5Gi
            limits:
              cpu: "4"
              memory: 12Gi
              ephemeral-storage: 20Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /home/appuser/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 15Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
