apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-pgvector-config
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  EMBEDDING__MODEL: "litellm_proxy/qwen3-embedding:8b"
  # Change this to the DNS name and port of your LiteLLM proxy Service.
  EMBEDDING__BASE_URL: "http://litellm:4000"
  # The PGVector column is currently fixed at 3072 dimensions in the application.
  EMBEDDING__DIMENSIONS: "3072"
  S3_HOST: ""
  S3_REGION: ""
  S3_BUCKET: ""
