[project]
name = "litellm-pgvector"
version = "1.3.0"
description = "OpenAI-compatible vector store API using PGVector and LiteLLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling==2.113.0",
    "docling-core==2.87.1",
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "light-s3-client==0.0.40",
    "litellm==1.88.6",
    "pgvector==0.2.4",
    "psycopg2-binary==2.9.11",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.31",
    "sqlalchemy==2.0.54",
    "sqlmodel==0.0.47",
    "transformers==5.14.1; sys_platform == 'linux'",
    "typing-extensions==4.16.0",
    "uvicorn==0.24.0",
]

[tool.uv]
package = false
