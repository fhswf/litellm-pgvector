name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.release.outputs.prs_created == 'true'
        with:
          version: 0.9.22

      - name: Update uv lockfile in the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r '.headBranchName' <<< "$RELEASE_PR")"
          git fetch origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: update uv lockfile"
            git push origin "HEAD:$branch"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.release_created == 'true'

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.release_created == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned container image
        if: steps.release.outputs.release_created == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fhswf/litellm-pgvector:${{ steps.release.outputs.tag_name }}
            ghcr.io/fhswf/litellm-pgvector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
