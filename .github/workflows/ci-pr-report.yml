name: CI PR report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: ci-pr-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update PR with CI results
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            let numbers = (run.pull_requests || []).map(pr => pr.number);

            // GitHub can omit pull_requests for runs from forks.
            if (!numbers.length && run.head_repository?.owner?.login && run.head_branch) {
              const candidates = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
                per_page: 100
              });
              numbers = candidates
                .filter(pr => pr.head.repo?.full_name === run.head_repository.full_name &&
                              pr.head.sha === run.head_sha)
                .map(pr => pr.number);
            }

            if (!numbers.length) {
              core.info('No matching pull request found for this CI run.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100
            });
            const format = result => ({
              success: '✅ Passed', failure: '❌ Failed',
              skipped: '⏭️ Skipped', cancelled: '⚪ Cancelled',
              timed_out: '⏱️ Timed out', action_required: '⚠️ Action required'
            })[result] || result || 'Unavailable';
            const row = (name, label) => {
              const job = jobs.find(job => job.name === name);
              return `| ${job ? `[${label}](${job.html_url})` : label} | ${format(job?.conclusion)} |`;
            };
            const marker = '<!-- litellm-pgvector-ci-results -->';
            const body = [
              marker,
              '## CI results',
              '| Job | Result |',
              '| --- | --- |',
              row('integration-tests', 'Integration tests'),
              row('build', 'Image build'),
              '',
              `Overall: ${format(run.conclusion)} · Commit: \`${run.head_sha.slice(0, 7)}\` · [Actions run](${run.html_url})`
            ].join('\n');

            for (const number of new Set(numbers)) {
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha) {
                core.info(`Skipping stale or closed PR #${number}.`);
                continue;
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100
              });
              const existing = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
              } else {
                await github.rest.issues.createComment({owner, repo, issue_number: number, body});
              }
            }
